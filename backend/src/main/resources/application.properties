spring.application.name=url-shortener

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/url_shortener}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:url_shortener}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:url_shortener}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
server.forward-headers-strategy=framework
